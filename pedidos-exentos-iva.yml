name: Pedidos sin IVA

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Dia a revisar (YYYY-MM-DD). Vacio = ayer"
        required: false
        default: ""

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar pedidos y enviar aviso
        run: python revisar_iva.py
        env:
          CRON_DISPARADOR: ${{ github.event.schedule }}
          FECHA: ${{ github.event.inputs.fecha }}
          MAGENTO_TOKEN: ${{ secrets.MAGENTO_TOKEN }}
          MAGENTO_USER: ${{ secrets.MAGENTO_USER }}
          MAGENTO_PASSWORD: ${{ secrets.MAGENTO_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ENVIAR_SI_VACIO: "false"
